<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 — SOUND OF SPEED</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loader -->
  <div id="loader" class="loader-overlay">
    <div class="loader-content">
      <div class="spinner"></div>
      <div class="loader-text">INITIALIZING TELEMETRY</div>
    </div>
  </div>

  <main id="app" class="hidden">
    
    <!-- Background Crossfader (Two-Slot Foolproof System) -->
    <div class="bg-container">
      <img id="bg-slot-1" class="bg-layer active" src="" alt="" />
      <img id="bg-slot-2" class="bg-layer" src="" alt="" />
    </div>
    
    <!-- Color Overlay -->
    <div id="color-overlay" class="color-overlay"></div>
    <div class="vignette"></div>

    <!-- UI Layer -->
    <div class="ui-layer">
      <!-- Driver Info -->
      <div class="driver-info">
        <div class="driver-number" id="driver-number">--</div>
        <div class="driver-name">
          <div id="driver-first-name"></div>
          <div id="driver-last-name"></div>
        </div>
      </div>

      <!-- Music Player -->
      <div class="music-player">
        <div class="player-top">
          <!-- Audio Visualizer (Fake/Aesthetic) -->
          <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          
          <div class="track-info">
            <div class="now-playing">NOW PLAYING</div>
            <div class="track-name" id="track-name">Loading...</div>
          </div>
          
          <div class="controls">
            <button id="btn-prev" class="control-btn"><i data-feather="skip-back"></i></button>
            <button id="btn-play" class="control-btn play-btn"><i id="icon-play" data-feather="play"></i></button>
            <button id="btn-next" class="control-btn"><i data-feather="skip-forward"></i></button>
          </div>
        </div>

        <div class="player-bottom">
          <div class="time" id="time-current">0:00</div>
          <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar-bg"></div>
            <div class="progress-bar-fill" id="progress-fill">
              <div class="progress-handle"></div>
            </div>
            <input type="range" id="progress-slider" min="0" max="100" step="0.1" value="0">
          </div>
          <div class="time" id="time-total">0:00</div>

          <div class="volume-control">
            <button id="btn-volume" class="vol-btn"><i id="icon-volume" data-feather="volume-2"></i></button>
            <div class="volume-slider-container">
              <div class="volume-bg"></div>
              <div class="volume-fill" id="volume-fill"></div>
              <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Audio Element -->
  <audio id="audio-player"></audio>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
